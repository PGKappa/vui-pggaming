server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione: i bundle JS/CSS e i manuali HTML pesano meno di un terzo
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # Redirect relativi (es. /virtual/dogs -> /virtual/dogs/): con quelli
    # assoluti nginx usa la propria porta (80) e lo schema http, sbagliati
    # dietro la mappatura di Docker o un proxy HTTPS
    absolute_redirect off;

    # Asset di Next.js: il nome del file contiene l'hash del contenuto,
    # quindi si possono tenere in cache per sempre. ^~ evita che la regola
    # per estensione qui sotto (font, immagini) abbia la precedenza
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Immagini, icone e font in public/: nome senza hash, cache breve
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Pagine HTML: sempre riconvalidate, così un nuovo deploy si vede subito
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
