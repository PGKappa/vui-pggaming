name: Deploy Staging

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          target: "runner"
          tags: ghcr.io/${{ github.repository }}/nginx:staging
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Update Image on staging
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod -R 700 ~/.ssh
          ssh-add ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no root@5.75.148.253 docker login -u ${{ github.repository_owner }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          ssh -o StrictHostKeyChecking=no root@5.75.148.253 docker pull ghcr.io/${{ github.repository }}/nginx:staging
          ssh -o StrictHostKeyChecking=no root@5.75.148.253 docker compose --project-directory /mnt/data/srv/pg-gaming -f /mnt/data/srv/pg-gaming/docker-compose.yaml up -d
          ssh -o StrictHostKeyChecking=no root@5.75.148.253 docker image prune -f
