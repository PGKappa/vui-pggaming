name: Stanleybet-STAGING Deploy to S3 + CloudFront

on:
  push:
    branches:
      - stanleybet2026-staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build
        shell: bash
        env:
          NEXT_PUBLIC_FE_VERSION: v1.${{ github.run_number }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      # Gli asset sotto _next/static hanno l'hash del contenuto nel nome, quindi
      # sono immutabili e build diversi possono convivere. Vanno caricati PRIMA
      # dell'HTML (così un documento nuovo trova sempre i suoi file) e senza
      # --delete: cancellarli spezza le sessioni già aperte e, se CloudFront
      # sta ancora servendo un HTML precedente, lascia la pagina senza runtime.
      - name: Sync immutable assets to S3
        run: |
          aws s3 sync out/_next/static s3://stanleybet-2025/retail-staging/out/_next/static \
            --cache-control "public,max-age=31536000,immutable"

      # HTML e payload di navigazione: qui --delete serve, per non lasciare in
      # giro rotte rimosse. no-cache non impedisce la cache, impone solo di
      # rivalidare: così appena esce un build nuovo tutti ricevono il documento
      # aggiornato invece di una copia vecchia.
      - name: Sync pages to S3
        run: |
          aws s3 sync out s3://stanleybet-2025/retail-staging/out \
            --delete --exclude "_next/static/*" \
            --cache-control "no-cache"

      - name: Create CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E62FB6U3LT372 \
            --paths "/*"
